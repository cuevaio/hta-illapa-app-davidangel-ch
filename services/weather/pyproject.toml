[project]
name = "weather-service"
version = "0.1.0"
description = "Backend de capas meteorológicas para el simulador: NOAA GFS, rayos GLM y nubes GOES-19 sobre Perú."
requires-python = ">=3.12,<3.13"
dependencies = [
  "eccodes==2.50.0",
  "eccodeslib==2.50.0.33",
  "fastapi==0.143.3",
  "h5py==3.16.0",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
weather = "weather_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_service"]
