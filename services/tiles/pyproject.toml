[project]
name = "tiles-service"
version = "0.1.0"
description = "Backend de tiles con caché de lectura para el simulador (terreno de Perú)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "httpx[http2]==0.28.1",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "rasterio==1.5.2",
  "boto3==1.43.114",
  "pyyaml==6.0.3",
  "prometheus-client==0.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "anyio==4.15.1", "jsonschema==4.26.0"]

[project.scripts]
tiles = "tiles_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiles_service"]
