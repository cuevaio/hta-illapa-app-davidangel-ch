# Local stack: S3-compatible storage (MinIO) + tiles backend on http://127.0.0.1:8080 + weather backend on :8788
#   docker compose up -d --build          -> API, /diagnostico, MinIO console on :9001
#   docker compose --profile prewarm run --rm prewarm   -> coarse-level prewarm (Terrain Tiles only)
# The MinIO credentials below are LOCAL DEFAULTS ONLY; override them via environment or .env, and use a
# secrets manager for R2/S3 in deployment. The official minio/minio image is no longer published on
# Docker Hub, so the archived Bitnami build of MinIO (pinned) is used; it also creates the bucket.
x-tiles-env: &tiles-env
  TILES_STORAGE: s3
  TILES_S3_ENDPOINT: http://minio:9000
  TILES_S3_BUCKET: ${TILES_S3_BUCKET:-tiles}
  TILES_S3_REGION: us-east-1
  TILES_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tiles-local}
  TILES_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tiles-local-dev-only}
  TILES_CONTACT: ${TILES_CONTACT:-xr-simulator local dev}
  TILES_CORS_ORIGINS: ${TILES_CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,http://localhost:5199,https://localhost:5443}
  TILES_TERRAIN_TILES_URL: ${TILES_TERRAIN_TILES_URL:-https://elevation-tiles-prod.s3.amazonaws.com}
  TILES_COPERNICUS_URL: ${TILES_COPERNICUS_URL:-https://copernicus-dem-30m.s3.amazonaws.com}
  TILES_TRUST_FORWARDED_FOR: ${TILES_TRUST_FORWARDED_FOR:-false}
  TILES_LOG_LEVEL: ${TILES_LOG_LEVEL:-INFO}
  TILES_GENERATION_DEADLINE_S: ${TILES_GENERATION_DEADLINE_S:-10}
  TILES_CIRCUIT_FAILURES: ${TILES_CIRCUIT_FAILURES:-5}
  TILES_CIRCUIT_COOLDOWN_S: ${TILES_CIRCUIT_COOLDOWN_S:-30}
  TILES_OUTAGE_TTL_S: ${TILES_OUTAGE_TTL_S:-15}
  TILES_CONNECT_TIMEOUT_S: ${TILES_CONNECT_TIMEOUT_S:-3}

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tiles-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tiles-local-dev-only}
      MINIO_DEFAULT_BUCKETS: ${TILES_S3_BUCKET:-tiles}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  tiles:
    build:
      context: ..
      dockerfile: services/tiles/Dockerfile
    image: xr-simulator-tiles:local
    environment: *tiles-env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Weather layers (NOAA GFS, GOES-19 GLM lightning and ABI clouds) on http://127.0.0.1:8788.
  # Independent of tiles/MinIO: `docker compose up -d --build weather` starts only this service.
  weather:
    build:
      context: ..
      dockerfile: services/weather/Dockerfile
    image: xr-simulator-weather:local
    environment:
      WEATHER_CACHE_DIR: /data/cache
      WEATHER_LOG_LEVEL: ${WEATHER_LOG_LEVEL:-INFO}
      WEATHER_REFRESH: ${WEATHER_REFRESH:-1}
      WEATHER_PRODUCTS: ${WEATHER_PRODUCTS:-gfs-t2m,gfs-wind10m,gfs-precip,gfs-cape}
      WEATHER_FHOURS: ${WEATHER_FHOURS:-0-48:3}
      WEATHER_GRID_WIDTH: ${WEATHER_GRID_WIDTH:-256}
      WEATHER_BBOX: ${WEATHER_BBOX:--81.5,-18.5,-68.5,0.2}
      WEATHER_MARGIN: ${WEATHER_MARGIN:-2}
      WEATHER_LIGHTNING: ${WEATHER_LIGHTNING:-1}
      WEATHER_GLM_WINDOW_MIN: ${WEATHER_GLM_WINDOW_MIN:-60}
      WEATHER_GLM_BACKFILL_MIN: ${WEATHER_GLM_BACKFILL_MIN:-60}
      WEATHER_GLM_POLL_S: ${WEATHER_GLM_POLL_S:-60}
      WEATHER_CLOUDS: ${WEATHER_CLOUDS:-1}
      WEATHER_CLOUDS_WIDTH: ${WEATHER_CLOUDS_WIDTH:-2048}
      WEATHER_CLOUDS_POLL_S: ${WEATHER_CLOUDS_POLL_S:-600}
      WEATHER_CLOUDS_KEEP: ${WEATHER_CLOUDS_KEEP:-6}
      WEATHER_CLOUDS_IR: ${WEATHER_CLOUDS_IR:-1}
      WEATHER_CORS_ORIGINS: ${WEATHER_CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,http://localhost:5199,https://localhost:5443}
    ports:
      - "127.0.0.1:${WEATHER_HOST_PORT:-8788}:8787"
    volumes:
      - weather-cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prewarm:
    profiles: ["prewarm"]
    image: xr-simulator-tiles:local
    environment: *tiles-env
    command: ["tiles", "precalentar", "--capa", "terreno", "--version", "v1", "--zmin", "0",
              "--zmax", "${TILES_PREWARM_ZMAX:-9}", "--concurrencia", "8"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  weather-cache:
