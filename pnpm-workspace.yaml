packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: true
  workerd: true
  # Optional postinstall hooks (eas-cli tracing, protobufjs) that nothing here needs.
  dtrace-provider: false
  protobufjs: false
catalog:
  maplibre-gl: 6.14.0
  react-map-gl: 8.1.3
  zod: ^4.5.4
  varlock: 1.18.0
  "@cloudflare/workers-types": ^5.20260906.1
  "@orpc/server": ^1.15.6
  "@orpc/openapi": ^1.15.6
  "@orpc/zod": ^1.15.6
  better-auth: 1.7.7
  next-themes: ^0.4.6
  sonner: ^2.0.8
  "@orpc/tanstack-query": ^1.15.6
  "@orpc/client": ^1.15.6
  "@tanstack/react-form": ^1.33.5
  tailwindcss: ^4.3.3
  "@better-auth/expo": 1.7.7
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  mysql2: ^3.24.4
  evlog: ^2.32.0
  hono: ^4.13.7
  vitest: ^5.0.1
  "@turf/centroid": ^7.4.0
  "@turf/helpers": ^7.4.0
  "@turf/boolean-point-in-polygon": ^7.4.0
  "@turf/buffer": ^7.4.0
  "@turf/bbox": ^7.4.0
  "@turf/distance": ^7.4.0
  ngraph.graph: 20.1.2
  ngraph.path: 1.6.1
  "@turf/length": ^7.4.0
  "@turf/line-intersect": ^7.4.0
  "@turf/nearest-point-on-line": ^7.4.0
  "@turf/along": ^7.4.0
  "@turf/bearing": ^7.4.0
  "@turf/destination": ^7.4.0
  "@types/geojson": ^7946.0.16
  ai: ^7.0.143
  "@ai-sdk/typesafe-ai": ^3.0.21
  aws4fetch: ^1.0.20
  three: 0.186.1
  "@types/three": 0.186.0
  "@babylonjs/core": 9.29.0
  "@babylonjs/gui": 9.29.0
  iwer: 2.5.0
  "@iwer/devui": 2.5.0
  "@iwer/sem": 2.5.0
minimumReleaseAgeExclude:
  - '@ai-sdk/provider-utils@5.0.62'
  - '@ai-sdk/provider@4.0.29'
  - '@ai-sdk/typesafe-ai@3.0.21'
  - '@ai-sdk/gateway@4.0.116'
  - ai@7.0.143

# @iwer/devui and @iwer/sem (the local WebXR emulator) pin three ^0.165; two
# three.js copies in one page break rendering, so every package shares ours.
overrides:
  three: 0.186.1
