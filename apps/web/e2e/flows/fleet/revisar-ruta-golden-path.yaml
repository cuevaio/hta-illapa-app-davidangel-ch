url: https://app-staging.52-21-151-223.sslip.io/login
name: Revisar ruta golden path
tags:
  - fleet
  - critical
---
- launchApp
- runFlow: ../../common/login.yaml
- extendedWaitUntil:
    visible: "Flota"
    timeout: 30000
- tapOn: "Flota"
- extendedWaitUntil:
    visible: "Tu flota"
    timeout: 20000
- runFlow:
    when:
      visible: "Usar flota demo"
    commands:
      - tapOn: "Usar flota demo"
      - extendedWaitUntil:
          visible: ".*Tracto 02.*"
          timeout: 30000
- takeScreenshot: 01-fleet-with-demo-trucks
- tapOn: "Revisar ruta"
- extendedWaitUntil:
    visible: "Elige un vehículo"
    timeout: 30000
- tapOn: "Elige un vehículo"
- tapOn: "Tracto 02 · Ate · DEM-102.*"
- takeScreenshot: 02-form-filled
- tapOn: "Revisar"
- extendedWaitUntil:
    visible: ".*rutas · Tracto 02 · Ate · 6 ejes.*"
    timeout: 60000
- takeScreenshot: 03-results
- assertVisible: "Recomendada"
- assertVisible: "Rutas ILLAPA"
- assertVisible: "Desvíos oficiales SUTRAN"
- assertVisible:
    text: "No habilitado para 6 ejes"
    index: 0
- tapOn:
    text: "Por qué"
    index: 0
- takeScreenshot: 04-why-expanded
- tapOn:
    text: "24 h"
    index: 0
- takeScreenshot: 05-horizon-24h
- tapOn:
    text: "Planificar viaje"
    index: 0
- extendedWaitUntil:
    visible: "Planificado"
    timeout: 30000
- takeScreenshot: 06-trip-planned
- tapOn: "Iniciar viaje"
- extendedWaitUntil:
    visible: "Ver en el mapa"
    timeout: 30000
- takeScreenshot: 07-trip-started
- tapOn: "Ver en el mapa"
- extendedWaitUntil:
    visible: ".*incidentes encontrados.*"
    timeout: 30000
- takeScreenshot: 08-map-after-start
- tapOn: "Mostrar flota"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-map-with-fleet
- tapOn: "Flota"
- extendedWaitUntil:
    visible: "En curso"
    timeout: 20000
- takeScreenshot: 10-fleet-trip-active
- tapOn:
    text: "Lima →.*Huancayo"
    index: 0
- extendedWaitUntil:
    visible: "Cancelar viaje"
    timeout: 20000
- tapOn: "Cancelar viaje"
- extendedWaitUntil:
    visible: "¿Cancelar este viaje?"
    timeout: 10000
- takeScreenshot: 11-cancel-confirm
- tapOn:
    text: "Cancelar viaje"
    index: 1
- extendedWaitUntil:
    visible: "Cancelado"
    timeout: 20000
- takeScreenshot: 12-cancelled
