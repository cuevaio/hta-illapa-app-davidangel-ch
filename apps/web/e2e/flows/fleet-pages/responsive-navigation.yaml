url: https://app-staging.52-21-151-223.sslip.io/login
name: Dashboard navigation works on narrow screens (run with SCREEN=390x844 or 1024x768)
tags:
  - fleet-pages
  - responsive
---
- launchApp
- runFlow: ../../common/login.yaml
- extendedWaitUntil:
    visible: "[0-9]+ incidentes encontrados.*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-mapa
- runFlow:
    when:
      visible:
        id: "Abrir o cerrar navegación"
    commands:
      - tapOn:
          id: "Abrir o cerrar navegación"
- runFlow:
    when:
      visible:
        id: "Expandir navegación"
    commands:
      - tapOn:
          id: "Expandir navegación"
- extendedWaitUntil:
    visible: "Flota"
    timeout: 10000
- takeScreenshot: 02-navigation-open
- tapOn: "Flota"
- extendedWaitUntil:
    visible: "Tu flota"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-flota
- runFlow:
    when:
      visible:
        id: "Abrir o cerrar navegación"
    commands:
      - tapOn:
          id: "Abrir o cerrar navegación"
- extendedWaitUntil:
    visible: "Alertas"
    timeout: 10000
- tapOn: "Alertas"
- extendedWaitUntil:
    visible: "Riesgos por delante"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-alertas
