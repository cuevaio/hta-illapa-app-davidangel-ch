url: https://dash-staging.getillapa.com/login
name: Mostrar flota draws the fleet trucks on the Mapa
tags:
  - fleet-pages
---
- launchApp
- runFlow: ../../common/login.yaml
- extendedWaitUntil:
    visible: "[0-9]+ incidentes encontrados.*"
    timeout: 45000
- extendedWaitUntil:
    visible: "Mostrar flota"
    timeout: 30000
- assertNotVisible:
    id: "Ver Tracto 0[1-6].*"
- tapOn: "Mostrar flota"
- extendedWaitUntil:
    visible:
      id: "Ver Tracto 02.*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Cargando rutas…"
    timeout: 30000
- takeScreenshot: 01-fleet-on-map
- tapOn:
    id: "Ver Tracto 02.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-truck-selected
- tapOn: "Mostrar flota"
- extendedWaitUntil:
    notVisible:
      id: "Ver Tracto 02.*"
    timeout: 10000
- takeScreenshot: 03-fleet-hidden
