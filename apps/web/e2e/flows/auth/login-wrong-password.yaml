url: https://app-staging.52-21-151-223.sslip.io/login
name: Wrong password shows the credentials error
tags:
  - auth
---
- launchApp
- extendedWaitUntil:
    visible: "Inicia sesión"
    timeout: 30000
- tapOn:
    id: auth-email
- inputText: ${EMAIL}
- tapOn:
    id: auth-password
- inputText: "wrong-password-e2e"
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Correo o contraseña incorrectos."
    timeout: 20000
- assertVisible: "Inicia sesión"
- takeScreenshot: 01-wrong-password
