appId: illapa-web
---
- openLink: ${APP_URL}/login
- extendedWaitUntil:
    visible: "Inicia sesión"
    timeout: 20000
- tapOn:
    id: auth-email
- inputText: ${EMAIL}
- tapOn:
    id: auth-password
- inputText: ${PASSWORD}
- tapOn: "Entrar"
- extendedWaitUntil:
    notVisible: "Inicia sesión"
    timeout: 20000
